name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=term-missing --cov-fail-under=80

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t securepipeline:test .

      - name: Run container and verify health
        run: |
          docker run -d --name sp-test -p 8000:8000 securepipeline:test
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop sp-test
